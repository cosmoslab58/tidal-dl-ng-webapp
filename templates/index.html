<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmosLab Tidal-DL</title>
    <meta name="theme-color" content="#17181a">
    <meta name="description" content="Paste a TIDAL link, watch it download.">
    <link rel="icon" type="image/x-icon" href="/tidal-dl/favicon.ico">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gunmetal-950: #101112;
            --gunmetal-900: #18191b;
            --panel-800: #232527;
            --panel-700: #2a2d2f;
            --panel-650: #303436;
            --well-950: #131415;
            --amber-500: #e8a33d;
            --amber-300: #f4c67a;
            --amber-glow: rgba(232, 163, 61, .45);
            --rec-red: #d1453d;
            --rec-red-glow: rgba(209, 69, 61, .55);
            --tape-green: #6fae72;
            --tape-green-glow: rgba(111, 174, 114, .5);
            --cream-100: #ede7d8;
            --cream-200: #d9d2bf;
            --steel-400: #9297a0;
            --steel-600: #5b6063;
            --seam: rgba(0, 0, 0, .55);
            --hairline: rgba(255, 255, 255, .06);

            --needle-rest: -42deg;
            --needle-angle: var(--needle-rest);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            color: var(--cream-100);
            background:
                radial-gradient(ellipse at top, rgba(255,255,255,.05), transparent 60%),
                repeating-linear-gradient(115deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px),
                linear-gradient(160deg, var(--gunmetal-900), var(--gunmetal-950));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .deck {
            position: relative;
            width: 100%;
            max-width: 30rem;
            background:
                linear-gradient(160deg, var(--panel-800), var(--panel-700) 55%, var(--panel-800));
            border-radius: 1.1rem;
            border: 1px solid var(--hairline);
            box-shadow:
                0 1px 0 rgba(255,255,255,.06) inset,
                0 30px 60px -20px rgba(0,0,0,.7),
                0 2px 4px rgba(0,0,0,.4);
            padding: 1.6rem 1.6rem 1.8rem;
        }

        .rivet {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6b6f72, #232527 70%);
            box-shadow: 0 1px 0 rgba(255,255,255,.15), 0 1px 2px rgba(0,0,0,.6) inset;
        }
        .rivet.tl { top: 10px; left: 10px; }
        .rivet.tr { top: 10px; right: 10px; }
        .rivet.bl { bottom: 10px; left: 10px; }
        .rivet.br { bottom: 10px; right: 10px; }

        /* ---- brand plate ---- */
        .plate {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: .85rem;
            margin-bottom: 1.1rem;
            border-bottom: 1px solid var(--seam);
        }
        .plate-brand {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 700;
            font-size: 1.55rem;
            letter-spacing: .04em;
            color: var(--cream-100);
            text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 -1px 0 rgba(255,255,255,.05);
        }
        .plate-brand span {
            color: var(--amber-500);
        }
        .plate-tag {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .62rem;
            letter-spacing: .18em;
            color: var(--steel-400);
            text-transform: uppercase;
        }
        .lamp {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--steel-600);
            box-shadow: 0 0 0 rgba(0,0,0,0);
            transition: background-color .25s ease, box-shadow .25s ease;
        }
        .deck.is-running .lamp {
            background: var(--rec-red);
            box-shadow: 0 0 8px 2px var(--rec-red-glow);
            animation: lamp-blink 1s step-start infinite;
        }
        .deck.is-done .lamp {
            background: var(--tape-green);
            box-shadow: 0 0 8px 2px var(--tape-green-glow);
            animation: none;
        }
        .deck.is-error .lamp {
            background: var(--rec-red);
            box-shadow: 0 0 10px 3px var(--rec-red-glow);
            animation: none;
        }
        @keyframes lamp-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: .25; }
        }

        /* ---- VU meter ---- */
        .meter-well {
            position: relative;
            background: radial-gradient(ellipse at 50% 100%, var(--well-950), #0b0c0c 80%);
            border-radius: .7rem;
            box-shadow: 0 2px 6px rgba(0,0,0,.6) inset, 0 1px 0 rgba(255,255,255,.04);
            padding: .6rem .9rem 0;
            margin-bottom: 1.1rem;
            overflow: hidden;
        }
        .meter-well::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%);
            pointer-events: none;
        }
        .meter { display: block; width: 100%; height: auto; }
        .meter-arc {
            fill: none;
            stroke: var(--steel-600);
            stroke-width: 1.5;
            stroke-linecap: round;
        }
        .meter-tick { stroke: var(--steel-600); stroke-width: 1.5; }
        .meter-tick.hot { stroke: var(--rec-red); opacity: .7; }
        .meter-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 6px;
            fill: var(--steel-400);
            letter-spacing: .04em;
        }
        .meter-needle {
            stroke: var(--amber-500);
            stroke-width: 2;
            stroke-linecap: round;
            transform-origin: 100px 96px;
            transform: rotate(var(--needle-angle));
            transition: transform .35s cubic-bezier(.34, 1.4, .64, 1), stroke .3s ease;
            filter: drop-shadow(0 0 3px var(--amber-glow));
        }
        .deck.is-error .meter-needle { stroke: var(--rec-red); filter: drop-shadow(0 0 5px var(--rec-red-glow)); }
        .deck.is-done .meter-needle { stroke: var(--tape-green); filter: drop-shadow(0 0 4px var(--tape-green-glow)); }
        .meter-pivot { fill: #45484a; stroke: #0c0d0d; stroke-width: 1; }
        @media (prefers-reduced-motion: no-preference) {
            .deck.is-idle .meter-needle { animation: idle-drift 4.5s ease-in-out infinite; }
        }
        @keyframes idle-drift {
            0%, 100% { transform: rotate(var(--needle-rest)); }
            50% { transform: rotate(calc(var(--needle-rest) + 4deg)); }
        }

        /* ---- input row ---- */
        .field-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: .62rem;
            letter-spacing: .16em;
            color: var(--steel-400);
            text-transform: uppercase;
            display: block;
            margin-bottom: .4rem;
        }
        .input-row {
            display: flex;
            gap: .6rem;
            margin-bottom: 1rem;
        }
        .input-well {
            position: relative;
            flex: 1;
            background: var(--well-950);
            border-radius: .6rem;
            box-shadow: 0 2px 4px rgba(0,0,0,.6) inset;
            border: 1px solid var(--seam);
        }
        #url {
            width: 100%;
            padding: .8rem 2.5rem .8rem .9rem;
            background: transparent;
            border: none;
            color: var(--amber-300);
            font-family: 'IBM Plex Mono', monospace;
            font-size: .85rem;
        }
        #url::placeholder { color: var(--steel-600); }
        #url:focus-visible {
            outline: 2px solid var(--amber-500);
            outline-offset: 2px;
            border-radius: .6rem;
        }
        #clear-button {
            position: absolute;
            right: .35rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            border: none;
            background: var(--panel-650);
            color: var(--steel-400);
            cursor: pointer;
            font-size: .75rem;
            line-height: 1;
        }
        #clear-button:hover { color: var(--cream-100); background: var(--panel-700); }
        #clear-button:focus-visible { outline: 2px solid var(--amber-500); outline-offset: 2px; }

        /* ---- transport controls ---- */
        .transport {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.1rem;
            margin-bottom: 1.2rem;
        }
        .btn-rec {
            display: flex;
            align-items: center;
            gap: .55rem;
            padding: .7rem 1.4rem;
            border-radius: 999px;
            border: 1px solid var(--seam);
            background: linear-gradient(180deg, var(--panel-650), var(--panel-800));
            color: var(--cream-100);
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            font-size: .8rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset;
            transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
        }
        .btn-rec .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--rec-red);
            box-shadow: 0 0 6px 1px var(--rec-red-glow);
        }
        .btn-rec:hover:not(:disabled) { background: linear-gradient(180deg, #34383a, var(--panel-800)); }
        .btn-rec:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset;
        }
        .btn-rec:disabled { opacity: .45; cursor: not-allowed; }
        .btn-rec:focus-visible { outline: 2px solid var(--amber-500); outline-offset: 2px; }

        .btn-stop {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .7rem 1.2rem;
            border-radius: .6rem;
            border: 1px solid var(--seam);
            background: linear-gradient(180deg, #3a2422, #2a1c1a);
            color: var(--cream-200);
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            font-size: .8rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,.5);
        }
        .btn-stop .sq { width: 9px; height: 9px; background: var(--rec-red); border-radius: 1px; }
        .btn-stop:hover { background: linear-gradient(180deg, #43302d, #2a1c1a); }
        .btn-stop:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
        .btn-stop:focus-visible { outline: 2px solid var(--amber-500); outline-offset: 2px; }
        .btn-stop.hidden { display: none; }

        /* ---- LCD readout ---- */
        .readout-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: .4rem;
        }
        .readout {
            position: relative;
            background: linear-gradient(180deg, #0d1210, #0a0e0c);
            border-radius: .6rem;
            border: 1px solid var(--seam);
            box-shadow: 0 2px 6px rgba(0,0,0,.6) inset;
            max-height: 15rem;
            overflow-y: auto;
            padding: .9rem 1rem;
        }
        .readout::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
        }
        .readout::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(160deg, rgba(255,255,255,.05), transparent 35%);
        }
        #output {
            position: relative;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .78rem;
            line-height: 1.6;
            color: var(--amber-300);
            text-shadow: 0 0 6px var(--amber-glow);
            white-space: pre-wrap;
            word-break: break-word;
        }
        #output:empty::before {
            content: 'Standing by \2014 paste a link and hit REC.';
            color: var(--steel-600);
            text-shadow: none;
        }

        .readout::-webkit-scrollbar { width: 8px; }
        .readout::-webkit-scrollbar-track { background: transparent; }
        .readout::-webkit-scrollbar-thumb { background: var(--panel-650); border-radius: 4px; }
        .readout::-webkit-scrollbar-thumb:hover { background: var(--steel-600); }

        @media (max-width: 420px) {
            .transport { flex-direction: column; align-items: stretch; }
            .btn-rec, .btn-stop { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="deck is-idle" id="deck">
        <span class="rivet tl"></span><span class="rivet tr"></span>
        <span class="rivet bl"></span><span class="rivet br"></span>

        <div class="plate">
            <div class="plate-brand">COSMOSLAB <span>TIDAL&#8202;-&#8202;DL</span></div>
            <div class="plate-tag"><span class="lamp" id="lamp"></span>REC</div>
        </div>

        <div class="meter-well">
            <svg class="meter" viewBox="0 0 200 108" role="img" aria-label="Activity meter">
                <path class="meter-arc" d="M 14 98 A 86 86 0 0 1 186 98" />
                <g class="meter-ticks">
                    <line class="meter-tick" x1="100" y1="14" x2="100" y2="24" />
                    <line class="meter-tick" x1="49" y1="29" x2="55" y2="37" />
                    <line class="meter-tick" x1="151" y1="29" x2="145" y2="37" />
                    <line class="meter-tick hot" x1="170" y1="55" x2="161" y2="60" />
                    <line class="meter-tick" x1="20" y1="55" x2="29" y2="60" />
                </g>
                <text class="meter-label" x="16" y="72">QUIET</text>
                <text class="meter-label" x="160" y="72">PEAK</text>
                <line class="meter-needle" id="needle" x1="100" y1="96" x2="100" y2="26" />
                <circle class="meter-pivot" cx="100" cy="96" r="6" />
            </svg>
        </div>

        <label class="field-label" for="url">Source &#8250; tidal link</label>
        <div class="input-row">
            <div class="input-well">
                <input
                    type="text"
                    id="url"
                    placeholder="https://tidal.com/browse/track/..."
                    aria-label="Tidal URL"
                />
                <button
                    id="clear-button"
                    type="button"
                    onclick="clearUrl()"
                    title="Clear the URL input"
                    aria-label="Clear URL"
                >&#10005;</button>
            </div>
        </div>

        <div class="transport">
            <button id="go-button" class="btn-rec" onclick="startDownload()">
                <span class="dot"></span>Rec
            </button>
            <button id="stop-button" class="btn-stop hidden" onclick="stopDownload()">
                <span class="sq"></span>Stop
            </button>
        </div>

        <div class="readout-label">
            <span class="field-label" style="margin-bottom:0">Readout</span>
        </div>
        <div class="readout">
            <div
                id="output"
                role="log"
                aria-live="polite"
                aria-atomic="false"
            ></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/static/service-worker.js').catch(function(err) {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>

    <script>
        let eventSource = null;
        let retryCount = 0;
        const maxRetries = 3;
        let settleTimer = null;

        const deck = document.getElementById('deck');
        const needle = document.getElementById('needle');

        // Messages the server sends to mark a job as finished, so the UI can
        // reset itself without the user having to click Stop.
        function isTerminalMessage(msg) {
            return msg === 'Download completed successfully'
                || msg === 'Download stopped'
                || msg.startsWith('Error:');
        }

        function setNeedleAngle(deg) {
            needle.style.setProperty('--needle-angle', deg + 'deg');
        }

        function restNeedle() {
            needle.style.setProperty('--needle-angle', 'var(--needle-rest)');
        }

        function setDeckState(state) {
            deck.classList.remove('is-idle', 'is-running', 'is-done', 'is-error');
            deck.classList.add('is-' + state);
        }

        function flickerNeedle() {
            // A small random swing per line of output, like a real level meter
            // reacting to a signal rather than a smooth, mechanical sweep.
            const angle = -30 + Math.random() * 65;
            setNeedleAngle(angle.toFixed(1));
        }

        function settleNeedle() {
            clearTimeout(settleTimer);
            settleTimer = setTimeout(restNeedle, 900);
        }

        function setRunningState(isRunning) {
            document.getElementById('go-button').disabled = isRunning;
            document.getElementById('stop-button').classList.toggle('hidden', !isRunning);
        }

        async function startDownload() {
            const url = document.getElementById('url').value;
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = 'Processing...';
            setRunningState(true);
            setDeckState('running');
            setNeedleAngle('0');

            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            try {
                const response = await fetch('/tidal-dl/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(url)}`
                });
                const result = await response.json();
                if (!response.ok) {
                    outputDiv.textContent = 'Error: ' + result.error + '\n';
                    setRunningState(false);
                    setDeckState('error');
                    setNeedleAngle('48');
                    settleNeedle();
                    return;
                }

                connectStream();
            } catch (error) {
                outputDiv.textContent = 'Error: ' + error.message + '\n';
                setRunningState(false);
                setDeckState('error');
                setNeedleAngle('48');
                settleNeedle();
            }
        }

        function clearUrl() {
            const input = document.getElementById('url');
            if (!input) return;
            input.value = '';
            input.focus();
        }

        function connectStream() {
            const outputDiv = document.getElementById('output');
            eventSource = new EventSource('/tidal-dl/stream');

            eventSource.onmessage = function(event) {
                if (event.data === 'keep-alive') return;

                outputDiv.textContent += event.data + '\n';
                outputDiv.scrollTop = outputDiv.scrollHeight;
                retryCount = 0;

                if (isTerminalMessage(event.data)) {
                    eventSource.close();
                    eventSource = null;
                    setRunningState(false);

                    if (event.data.startsWith('Error:')) {
                        setDeckState('error');
                        setNeedleAngle('48');
                    } else {
                        setDeckState('done');
                        setNeedleAngle('0');
                    }
                    settleNeedle();
                } else {
                    flickerNeedle();
                }
            };

            eventSource.onerror = function() {
                if (retryCount < maxRetries) {
                    outputDiv.textContent += `Connection lost, retrying...\n`;
                    eventSource.close();
                    eventSource = null;
                    retryCount++;
                    setTimeout(connectStream, 2000);
                } else {
                    outputDiv.textContent += 'Error: Failed to connect to stream\n';
                    eventSource.close();
                    eventSource = null;
                    setRunningState(false);
                    setDeckState('error');
                    setNeedleAngle('48');
                    settleNeedle();
                }
            };
        }

        async function stopDownload() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            const outputDiv = document.getElementById('output');
            outputDiv.textContent += 'Stream stopped\n';
            setRunningState(false);
            setDeckState('idle');
            restNeedle();
            try {
                await fetch('/tidal-dl/stop', { method: 'POST' });
            } catch (error) {
                outputDiv.textContent += 'Error stopping download: ' + error.message + '\n';
            }
        }
    </script>
</body>
</html>
